packages:
  - apps/*
  - examples/*
  - packages/*

catalog:
  '@types/fs-extra': ^11.0.4
  '@types/lodash-es': ^4.17.12
  '@types/node': 24.5.2
  fs-extra: ^11.3.2
  lodash-es: ^4.17.21
  rimraf: ^6.0.1
  typescript: 5.9.2
  vite-tsconfig-paths: ^5.1.4
  vitest: 5.0.4
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
