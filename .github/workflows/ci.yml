name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      # Workspace imports resolve through generated JavaScript and declarations.
      - run: vp run build
      - run: vp check
      - run: vp run tc
      - run: vp run test:coverage
      - run: vp run test:integration
      - run: vp run docs#validate
